<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家電リサイクル伝票</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif;color:#222;background:#f4f4f2}
header{background:#fff;border-bottom:1px solid #ddd;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:2}
h1{font-size:17px;font-weight:600;margin:0 6px 0 0}
.ver{font-size:12px;color:#888}
.sp{flex:1}
button{min-height:36px;padding:0 14px;font:inherit;border:1px solid #bbb;border-radius:8px;background:#fff;color:inherit;cursor:pointer}
button.pri{background:#185fa5;border-color:#185fa5;color:#fff;font-weight:600}
button:disabled{opacity:.6}
.tabs button.on{background:#222;border-color:#222;color:#fff}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap;display:inline-block}
.w{background:#faeeda;color:#854f0b}.d{background:#fcebeb;color:#a32d2d}.o{background:#e6f1fb;color:#185fa5}.n{background:#f1efe8;color:#5f5e5a}.g{background:#eaf3de;color:#3b6d11}.p{background:#eeedfe;color:#534ab7}
.hidden{display:none!important}
/* 送信 */
#paneSend{max-width:560px;margin:0 auto;padding:16px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pick label{display:flex;align-items:center;justify-content:center;min-height:56px;border:2px solid #555;font-weight:600;border-radius:10px;background:#fff;cursor:pointer}
input[type=file]{display:none}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px;margin-bottom:12px}
.card canvas{display:block;width:100%;height:auto;border-radius:6px;background:#eee}
.tools3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.tools3 button{min-height:48px}
.del{color:#a32d2d}
#send{width:100%;min-height:56px}
#send:disabled{opacity:1;background:#c9d6e3;border-color:#c9d6e3;color:#f4f7fa;cursor:default}
.note{font-size:14px;color:#555;margin:0 0 12px;min-height:1.5em}
.note.err{color:#a32d2d}.note.ok{color:#3b6d11}
/* PC */
#bar{padding:8px 16px;font-size:13px;display:none}
#bar.e{display:block;background:#fcebeb;color:#a32d2d}#bar.k{display:block;background:#eaf3de;color:#3b6d11}
.pcbar{background:#fff;border-bottom:1px solid #ddd;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
#work{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(340px,1fr);height:calc(100vh - 110px)}
.left{background:#e9e7e0;overflow:auto;padding:12px}
.left img{display:block;width:100%;background:#fff;cursor:zoom-in}
.left img.z{width:200%;max-width:none;cursor:zoom-out}
.right{background:#fff;overflow:auto;padding:16px}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
#prev,#next{border:2px solid #9a9a9a}
#prev:hover,#next:hover{background:#e8e8e6}
.kindTag{font-size:15px;font-weight:700;min-height:36px;padding:0 18px;border-radius:8px;display:inline-flex;align-items:center}
.kindTag.g{background:#c8e4a9;color:#2f5a0d;border:2px solid #8fbf68}.kindTag.p{background:#d4cdf7;color:#4a40a8;border:2px solid #a397ea}
.nav b{font-size:16px;min-width:70px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.w2{grid-column:1/3}
.grid label,#np label{display:block;font-size:12px;color:#5f5e5a}
.grid input,.grid select,#np input,#np select{width:100%;height:34px;font:inherit;border:1px solid #bbb;border-radius:6px;padding:0 8px;background:#fff}
input[readonly]{background:#f4f4f2;color:#5f5e5a}
#msgs p{margin:0 0 4px;font-size:13px;color:#854f0b}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;margin-top:8px}
#np{display:none;background:#f4f4f2;border-radius:8px;padding:10px;margin-top:10px}
#np .row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;align-items:end}
#ne{margin:6px 0 0;font-size:12px;color:#a32d2d}
.ex{opacity:.45}
#empty{padding:80px 16px;text-align:center;color:#5f5e5a;line-height:2}
.tools{display:flex;gap:6px;margin-bottom:8px}
dialog{border:none;border-radius:12px;padding:16px;width:min(92vw,420px)}
dialog label{display:block;font-size:13px;color:#555;margin:10px 0 4px}
dialog input{width:100%;height:40px;font:inherit;border:1px solid #bbb;border-radius:8px;padding:0 8px}
dialog .row{display:flex;gap:8px;margin-top:14px}
dialog .row button{flex:1;min-height:44px}
#busy{text-align:center;padding:24px 20px}
#busy b{display:block;font-size:16px;margin-bottom:16px}
#busySpin{width:44px;height:44px;margin:0 auto 14px;border:4px solid #dbe6f1;border-top-color:#185fa5;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#busyBar{height:12px;margin:0 0 14px;background:#e6e4dd;border-radius:6px;overflow:hidden}
#busyFill{height:100%;width:0;background:#185fa5;transition:width .2s}
#busyText{margin:0;font-size:14px;color:#555}
</style></head><body>
<header>
  <h1>家電リサイクル伝票</h1><span class="ver">Ver 1.9</span>
  <span class="tabs"><button id="tabSend">送信</button> <button id="tabPc">取り込み・確認</button></span>
  <span class="sp"></span>
  <button id="openCfg">設定</button>
</header>

<section id="paneSend">
  <div class="pick">
    <label>撮影する<input id="cam" type="file" accept="image/*" capture="environment"></label>
    <label>フォルダから選択<input id="lib" type="file" accept="image/*" multiple></label>
  </div>
  <p id="sendNote" class="note">向きを確認してから送信してください。緑と紫は自動で判別します。</p>
  <div id="photos"></div>
  <button id="send" class="pri" disabled>送信して読み取り</button>
</section>

<section id="panePc" class="hidden">
  <div class="pcbar">
    <span>台帳：<b id="folderName">未選択</b></span><button id="openFolder">台帳フォルダを選ぶ</button>
    <span id="xl" class="tag n"></span>
    <span class="sp"></span>
    <span id="remote" class="tag n">確認中</span>
    <button id="import">読み取り結果を取り込む</button>
    <button id="saveAll" class="pri">全データ保存</button>
  </div>
  <div id="bar"></div>
  <div id="empty"></div>
  <div id="work" style="display:none">
    <div class="left"><div class="tools"><button id="rot">回転</button><button id="zoom">拡大</button></div><img id="pic" alt="伝票の写真"></div>
    <div class="right">
      <div class="nav"><button id="prev">◀ 前へ</button><b id="pos"></b><button id="next">次へ ▶</button><span class="sp"></span><span id="kind"></span></div>
      <div id="title" style="font-weight:600;margin-bottom:8px"></div>
      <div id="form" class="grid">
        <div><label>品目</label><select id="item"><option value="">選択</option><option>エアコン</option><option>テレビ</option><option>冷蔵庫</option><option>洗濯機</option><option>乾燥機</option></select></div>
        <div><label>シート（自動）</label><input id="sheet" readonly></div>
        <div><label>交付日</label><input id="date" placeholder="年-月-日"></div>
        <div><label>引取日（紫のみ）</label><input id="pickup" placeholder="年-月-日"></div>
        <div class="w2"><label>排出者</label><input id="name"></div>
        <div><label>電話番号</label><input id="tel"></div>
        <div><label>住所</label><input id="addr"></div>
        <div class="w2"><label>製造業者名（コード）</label><select id="maker"></select></div>
        <div><label>管理番号</label><input id="number"></div>
        <div><label>備考</label><input id="note"></div>
      </div>
      <div id="np">
        <div class="row">
          <div><label>製造業者名</label><input id="nn"></div>
          <div><label>コード</label><input id="nc" maxlength="3"></div>
          <div><label>グループ</label><select id="ng"><option>A</option><option>B</option></select></div>
          <button id="na">登録</button>
        </div>
        <p id="ne"></p>
      </div>
      <label class="chk" id="candL" style="display:none"><input type="checkbox" id="cand"><span id="candT"></span></label>
      <label class="chk" id="overL" style="display:none"><input type="checkbox" id="over"><span>台帳の引取日を上書きする</span></label>
      <div id="msgs" style="margin-top:10px"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:12px"><button id="exclude">この伝票を除外</button></div>
    </div>
  </div>
</section>

<dialog id="cfg">
  <b>設定</b>
  <label>処理用リポジトリ</label><input id="repo" placeholder="markone-1/recycle-ocr">
  <label>GitHub アクセストークン</label><input id="token" type="password" autocomplete="off">
  <div class="row"><button id="cancelCfg">キャンセル</button><button id="saveCfg" class="pri">保存</button></div>
</dialog>

<dialog id="busy">
  <b>伝票データ取り込み中</b>
  <div id="busySpin"></div>
  <div id="busyBar" class="hidden"><div id="busyFill"></div></div>
  <p id="busyText"></p>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/common.js"></script>
<script src="js/rules.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/send.js"></script>
<script src="js/pc.js"></script>
<script>
"use strict";
let pcReady = false;
function tab(name) {
  $("paneSend").classList.toggle("hidden", name !== "send");
  $("panePc").classList.toggle("hidden", name !== "pc");
  $("tabSend").classList.toggle("on", name === "send");
  $("tabPc").classList.toggle("on", name === "pc");
  store.set("tab", name);
  if (name === "pc" && !pcReady) { pcReady = true; openFolder(false); }
}
$("tabSend").onclick = () => tab("send");
$("tabPc").onclick = () => tab("pc");
initSettings(() => { if (pcReady) remote(); });
initSend();
initPc();
// PC（Chrome/Edge で画面が広い）なら取り込み・確認、スマホなら送信を開く
tab(store.get("tab") || (window.showDirectoryPicker && innerWidth >= 900 ? "pc" : "send"));
</script>
</body></html>
